services:
  landing-page:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: global-core-technologies-landing:local
    container_name: gct-landing
    ports:
      - "${PORT_BINDING:-3000:3000}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-3000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-3000}/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - nginx_red_compartida

  landing-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: global-core-technologies-landing-api:local
    container_name: gct-landing-api
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
    restart: unless-stopped
    networks:
      - nginx_red_compartida

networks:
  nginx_red_compartida:
    external: true
