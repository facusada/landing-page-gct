services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
    image: global-core-technologies-landing:local
    container_name: gct-landing
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-3000}
    restart: "no"
    networks:
      nginx_red_compartida:
        ipv4_address: ${IPV4_ADDRESS}

networks:
  nginx_red_compartida:
    external: true
