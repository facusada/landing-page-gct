# Deploy automático a gct-vm en cada push a main
trigger:
  branches:
    include:
      - main

pool:
  name: 'gct-vm'

steps:
  - script: |
      set -euo pipefail
      cd /etc/GlobalCore/landing-page
      git pull origin main

      # Archivos de entorno requeridos (gitignored, viven en el servidor).
      # Ver .env.example y backend/.env.example para las claves necesarias.
      missing=0
      for f in .env backend/.env; do
        if [ ! -f "$f" ]; then
          echo "ERROR: falta '$f' en el servidor."
          missing=1
        fi
      done
      if [ "$missing" -ne 0 ]; then
        echo "Crear los archivos de entorno faltantes y reintentar el deploy."
        exit 1
      fi

      # --wait: no devuelve hasta que el contenedor pasa el healthcheck.
      # Mantiene la versión vieja sirviendo hasta que la nueva está lista (sin downtime de deploy).
      docker compose up --build -d --wait --remove-orphans

      # Opción 1 — estáticos servidos por nginx.
      # Extraemos .output/public a un directorio del host que nginx sirve por bind-mount.
      # Así los logos/_nuxt siguen disponibles aunque el contenedor Nuxt se reinicie o crashee.
      # docker cp hace merge sobre el destino: sobreescribe lo cambiado y conserva los
      # assets hasheados viejos (clientes con HTML cacheado siguen pudiendo cargar sus chunks).
      STATIC_DIR=/etc/GlobalCore/landing-static
      mkdir -p "$STATIC_DIR"
      # Remover directorio de estáticos antiguo para evitar conflictos de permisos
      rm -rf "$STATIC_DIR/_nuxt" "$STATIC_DIR/logos"
      docker cp gct-landing:/app/.output/public/. "$STATIC_DIR/"

      docker image prune -f
    displayName: 'Deploy landing page + API'
