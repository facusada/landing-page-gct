<svg width="1920" height="460" viewBox="0 0 1920 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract dark navy security shield background">
  <defs>
    <radialGradient id="bgs" gradientUnits="userSpaceOnUse" cx="1382" cy="180" r="1550">
      <stop offset="0%" stop-color="#11293f"/>
      <stop offset="48%" stop-color="#0a1c2d"/>
      <stop offset="100%" stop-color="#060e18"/>
    </radialGradient>
    <radialGradient id="amberGlowS" gradientUnits="userSpaceOnUse" cx="1430" cy="200" r="560">
      <stop offset="0%" stop-color="#f5912e" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#f5912e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f5912e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlowS" gradientUnits="userSpaceOnUse" cx="1620" cy="340" r="480">
      <stop offset="0%" stop-color="#3b82c4" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#3b82c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftFadeS" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1920" y2="0">
      <stop offset="0%" stop-color="#060e18" stop-opacity="0.92"/>
      <stop offset="42%" stop-color="#060e18" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#060e18" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topbotS" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="460">
      <stop offset="0%" stop-color="#060e18" stop-opacity="0.5"/>
      <stop offset="22%" stop-color="#060e18" stop-opacity="0"/>
      <stop offset="80%" stop-color="#060e18" stop-opacity="0"/>
      <stop offset="100%" stop-color="#060e18" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="shieldStrokeS" gradientUnits="userSpaceOnUse" x1="1300" y1="60" x2="1560" y2="420">
      <stop offset="0%" stop-color="#f5912e"/>
      <stop offset="100%" stop-color="#5aa0d8"/>
    </linearGradient>
    <pattern id="gridS" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#274a64" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="460" fill="url(#bgs)"/>
  <rect width="1920" height="460" fill="url(#gridS)"/>
  <circle cx="1430" cy="200" r="560" fill="url(#amberGlowS)"/>
  <circle cx="1620" cy="340" r="480" fill="url(#blueGlowS)"/>

  <!-- Circuit traces feeding into the shield (protected network) -->
  <g stroke="#5aa0d8" stroke-opacity="0.18" stroke-width="1.3" fill="none">
    <path d="M1920 120 H1760 l-30 30 H1640"/>
    <path d="M1920 230 H1820 l-26 -26 H1700"/>
    <path d="M1920 330 H1780 l-34 34 H1660"/>
    <path d="M980 110 H1120 l28 28 H1240"/>
    <path d="M980 280 H1100 l30 -30 H1250"/>
    <path d="M980 380 H1160 l26 -26 H1280"/>
  </g>
  <g fill="#7cb6e8" fill-opacity="0.6">
    <circle cx="1760" cy="120" r="3"/><circle cx="1820" cy="230" r="3"/><circle cx="1780" cy="330" r="3"/>
    <circle cx="1120" cy="110" r="3"/><circle cx="1100" cy="280" r="3"/><circle cx="1160" cy="380" r="3"/>
  </g>

  <!-- Central shield with padlock (the signature) -->
  <g transform="translate(1430 230)">
    <path d="M0 -175 L150 -110 L150 25 C150 130 80 200 0 240 C-80 200 -150 130 -150 25 L-150 -110 Z"
          fill="#0e2236" fill-opacity="0.55" stroke="url(#shieldStrokeS)" stroke-width="2.5" stroke-opacity="0.7"/>
    <path d="M0 -150 L126 -93 L126 22 C126 112 66 172 0 206 C-66 172 -126 112 -126 22 L-126 -93 Z"
          fill="none" stroke="#5aa0d8" stroke-width="1" stroke-opacity="0.3"/>
    <!-- padlock -->
    <g stroke="#f5912e" stroke-opacity="0.85" fill="none" stroke-width="6">
      <path d="M-30 -20 V-40 a30 30 0 0 1 60 0 V-20" stroke-linecap="round"/>
    </g>
    <rect x="-45" y="-22" width="90" height="78" rx="10" fill="#f5912e" fill-opacity="0.18" stroke="#f5912e" stroke-opacity="0.7" stroke-width="2.5"/>
    <circle cx="0" cy="10" r="7" fill="#f5912e" fill-opacity="0.9"/>
    <rect x="-3" y="14" width="6" height="20" rx="3" fill="#f5912e" fill-opacity="0.9"/>
  </g>

  <!-- Faint ridge lines -->
  <g stroke="#2a4a66" stroke-opacity="0.14" stroke-width="1.4" fill="none">
    <path d="M0 460 L260 300 L420 370 L640 260 L820 350"/>
  </g>

  <rect width="1920" height="460" fill="url(#leftFadeS)"/>
  <rect width="1920" height="460" fill="url(#topbotS)"/>
</svg>
