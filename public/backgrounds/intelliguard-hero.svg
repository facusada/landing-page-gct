<svg width="1920" height="900" viewBox="0 0 1920 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract dark navy security network background">
  <defs>
    <radialGradient id="bg" cx="68%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#13283d"/>
      <stop offset="45%" stop-color="#0c1d2e"/>
      <stop offset="100%" stop-color="#070f19"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5912e" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#f5912e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f5912e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82c4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#070f19" stop-opacity="0.92"/>
      <stop offset="42%" stop-color="#070f19" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#070f19" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#070f19" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#070f19" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5912e"/>
      <stop offset="100%" stop-color="#5aa0d8"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2a4a66" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="1920" height="900" fill="url(#bg)"/>
  <rect width="1920" height="900" fill="url(#grid)"/>
  <ellipse cx="1320" cy="330" rx="620" ry="520" fill="url(#amberGlow)"/>
  <ellipse cx="1620" cy="620" rx="480" ry="420" fill="url(#blueGlow)"/>
  <g stroke="#5aa0d8" stroke-opacity="0.22" stroke-width="1.2">
    <line x1="1180" y1="250" x2="1380" y2="180"/>
    <line x1="1380" y1="180" x2="1560" y2="300"/>
    <line x1="1560" y1="300" x2="1700" y2="220"/>
    <line x1="1380" y1="180" x2="1450" y2="400"/>
    <line x1="1450" y1="400" x2="1180" y2="250"/>
    <line x1="1450" y1="400" x2="1620" y2="500"/>
    <line x1="1560" y1="300" x2="1620" y2="500"/>
    <line x1="1620" y1="500" x2="1780" y2="430"/>
    <line x1="1620" y1="500" x2="1500" y2="650"/>
    <line x1="1500" y1="650" x2="1300" y2="560"/>
    <line x1="1300" y1="560" x2="1450" y2="400"/>
    <line x1="1300" y1="560" x2="1180" y2="700"/>
    <line x1="1500" y1="650" x2="1720" y2="700"/>
  </g>
  <g fill="#7cb6e8">
    <circle cx="1180" cy="250" r="4" fill-opacity="0.7"/>
    <circle cx="1380" cy="180" r="5" fill-opacity="0.85"/>
    <circle cx="1560" cy="300" r="4" fill-opacity="0.7"/>
    <circle cx="1700" cy="220" r="3.5" fill-opacity="0.6"/>
    <circle cx="1620" cy="500" r="4" fill-opacity="0.7"/>
    <circle cx="1780" cy="430" r="3" fill-opacity="0.5"/>
    <circle cx="1500" cy="650" r="4.5" fill-opacity="0.8"/>
    <circle cx="1300" cy="560" r="4" fill-opacity="0.7"/>
    <circle cx="1180" cy="700" r="3" fill-opacity="0.5"/>
    <circle cx="1720" cy="700" r="3.5" fill-opacity="0.6"/>
