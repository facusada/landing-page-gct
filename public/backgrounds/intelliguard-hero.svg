  <circle cx="1450" cy="400" r="7" fill="#f5912e" fill-opacity="0.9"/>
  <circle cx="1450" cy="400" r="16" fill="none" stroke="#f5912e" stroke-opacity="0.35" stroke-width="1.5"/>
  <g transform="translate(1430 420)" opacity="0.5" filter="url(#blur)">
