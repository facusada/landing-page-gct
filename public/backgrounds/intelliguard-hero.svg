    <path d="M-70 5 L-15 65 L80 -55" fill="none" stroke="#f5912e" stroke-width="6" stroke-opacity="0.55"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect width="1920" height="900" fill="url(#leftFade)"/>
  <rect x="0" y="600" width="1920" height="300" fill="url(#bottomFade)"/>
