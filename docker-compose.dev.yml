# Entorno de desarrollo / test.
# Levanta el backend con MAIL_BACKEND=log: los correos NO se envían, se imprimen
# en el log del contenedor (docker compose -f docker-compose.dev.yml logs -f landing-api).
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Para probar el envío real por Microsoft Graph desde local, ver backend/README.md
# ("Probar el envío real"): se usa backend/.env (gitignored) con MAIL_BACKEND=graph.
#
services:
  landing-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: global-core-technologies-landing-api:dev
    container_name: gct-landing-api-dev
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      MAIL_BACKEND: log
      MAIL_FROM: no-reply@gctechs.com
      MAIL_FROM_NAME: Global Core Technologies
      MAIL_TO: info@gctechs.com
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001"
    restart: unless-stopped
